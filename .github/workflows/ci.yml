name: Undercurrent Geospatial CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Geospatial Pipeline & API Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Geospatial Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev gdal-bin

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Clean-Install & Dependency Import Tests
      run: |
        python tests/test_dependencies.py

    - name: Run Synthetic Raster Fixtures & Processing Tests
      env:
        OPENBLAS_NUM_THREADS: "1"
      run: |
        python tests/test_raster_processing.py

    - name: Run Full Integration & Risk Engine API Test Suite
      env:
        OPENBLAS_NUM_THREADS: "1"
      run: |
        python tests/test_api.py

    - name: Execute Reproducible Two-Date Pipeline & Mask Verification
      env:
        OPENBLAS_NUM_THREADS: "1"
      run: |
        python scripts/run_reproducible_raster_pipeline.py
